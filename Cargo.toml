[package]
name = "rust-wallet"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
axum = "0.8.9"
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "signal"] }
